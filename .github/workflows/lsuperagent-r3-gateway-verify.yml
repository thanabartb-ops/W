name: LSUPERAGENT R3 Gateway Verify

on:
  pull_request:
    branches:
      - main
    paths:
      - projects/lsuperagent-control-center/**
      - .github/workflows/lsuperagent-r3-gateway-verify.yml

permissions:
  contents: read

jobs:
  verify:
    name: R3_GATEWAY source verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: projects/lsuperagent-control-center

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: projects/lsuperagent-control-center/pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Vitest
        run: pnpm vitest run

      - name: Lint
        run: pnpm lint

      - name: TypeScript
        run: pnpm exec tsc --noEmit

      - name: Production build
        run: pnpm build
