name: LSUPERAGENT R8 Vercel Credential Presence

on:
  push:
    branches:
      - agent/lsuperagent-r7-gateway-command-v1
    paths:
      - '.github/workflows/lsuperagent-r8-vercel-credential-presence.yml'

permissions:
  contents: read

jobs:
  presence:
    runs-on: ubuntu-24.04
    steps:
      - name: Check deployment credential presence only
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -n "${!key}" ]; then
              echo "${key}_PRESENT=yes"
            else
              echo "${key}_PRESENT=no"
            fi
          done
