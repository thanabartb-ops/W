schema:
  name: LSUPERAGENT_MEMORY_CORE
  version: 1.1.0
  status: DATABASE_FOUNDATION_DEPLOYED
  owner: THANABAT SOMSAK
  canonical_authority: LSUPERAGENT

source_of_truth:
  durable_operational_memory: Supabase private schema lsuperagent
  approval_and_audit: Supabase private schema lsuperagent
  retrieval_index: derived from canonical records only
  session_continuity: OpenAI Responses/Conversations, non-canonical
  secrets: Supabase Vault references only

release:
  approval: RELEASE_APPROVED
  production_project: lsuperagent-runtime
  project_ref: ilzjtbfhoxirsuilwmor
  applied_migration: 20260818200849_lsuperagent_memory_core
  migration_source_sha: acce8fba75ca4772e05e58ca0148d36f81e0dfcf
  verified:
    - private_schema_exists
    - RLS_enabled_on_memory_tables
    - anon_and_authenticated_denied
    - service_role_granted
    - public_rls_auto_enable_execute_revoked
  client_integration: blocked_until_trusted_writer_and_policy_gate_are_deployed

hard_rules:
  - No model output, compaction item, or session summary writes canonical memory directly.
  - Every fact-like record has source references, evidence level, validity, and integrity hash.
  - User preference and identity changes require explicit user approval.
  - System state, release state, and operational lessons require independent validation.
  - Audit events are append-only; corrections are new events, never silent edits.
  - Client roles have no access to the private memory schema.

memory_lifecycle:
  states:
    - candidate
    - verified
    - canonical
    - superseded
    - revoked
    - expired
  write_gate:
    - classify_and_redact
    - attach_source_and_scope
    - policy_and_validator_check
    - canonical_transaction
    - append_audit_event
    - update_retrieval_index

renderer_contract:
  renderer: wforge-image-mcp-wxx
  authority: execution_only
  direct_memory_write: prohibited
  allowed_stages:
    - generate_scene
    - generate_text_layer
    - composite_final
  required_before_render:
    - locked_IMAGE_Spec
    - BRIEF_PICTURE
    - explicit_user_Approved
  input_minimization:
    prohibited:
      - secrets
      - Vault_values
      - durable_profile_data
      - unredacted_personal_data
    references: approved_assets_or_authorized_URLs_only
  stage_controls:
    generate_scene: current_locked_brief_and_approval_only
    generate_text_layer: copy_must_exactly_match_copy_source_of_truth
    composite_final: immutable_scene_and_text_layer_refs_from_same_work_and_brief
  required_artifact_manifest:
    - work_id
    - brief_hash
    - approval_ref
    - renderer
    - stage
    - source_artifact_refs
    - output_ref
    - aspect_ratio
    - content_hash
    - copy_integrity
    - qc_status
    - policy_decision_id
  audit_actions:
    - render_requested
    - scene_rendered
    - text_layer_rendered
    - composite_rendered
    - render_qc_passed
    - render_qc_failed
    - artifact_registered
  promotion_rule: only_LSUPERAGENT_validates_and_registers_artifacts

release_guard:
  database_migration: supabase/migrations/20260818000100_lsuperagent_memory_core.sql
  requires:
    - Draft PR review
    - Security advisor re-check after apply
    - Smoke query against private schema
    - Edge Function or trusted server writer before client integration
    - RELEASE_APPROVED for production migration
  security_remediation:
    - Revoke direct EXECUTE from public, anon, and authenticated on public.rls_auto_enable().
  prohibited:
    - Direct browser access to lsuperagent schema
    - Public SECURITY DEFINER functions for memory writes
    - Raw secret storage in memory records
    - Direct renderer writes to Supabase or canonical memory
