  - WFORGE
  - BANKDNA
  - SERREZ
  - KEY_VISUAL
  - PROMOTIONAL_DESIGN
  excluded_by_default:
  - Unrelated client identities
  - Unapproved external character identities
  - Historical style packs
  - Experimental looks not approved in a Reference Map
  - Any visual asset outside the declared active set
  project_override_rule:
    allowed: true
    requires:
    - Approved Reference Map
    - Approved Final Brief
    must_preserve:
    - Core identity
    - Character recognizability
    - Brand hierarchy
    - Creative integrity gate
creative_locks:
  required:
  - DNA
  - AAA_QUALITY
  - OPEN_WORLD_CONTINUITY
  - IDENTITY
  - STYLE
  - TYPOLOGY
  - MOBILE_READABILITY
  - EXACT_TEXT_ACCURACY
  tolerance:
    identity_drift: ZERO_TOLERANCE
    character_drift: ZERO_TOLERANCE
    brand_drift: ZERO_TOLERANCE
    style_drift: CONTROLLED_ONLY
    material_repetition: CONTROLLED
    reference_drift: ZERO_TOLERANCE
    typography_drift: CONTROLLED_ONLY
visual_dna:
  primary_direction: CHARACTER_LED_WORLD_BUILDING
  core_style: DARK_PREMIUM_STREET_GAMING
  quality_bar: AAA_PRODUCTION
  composition:
    hero_first: true
    offer_object_clear: true
    strong_hierarchy: true
    mobile_readability: true
    controlled_negative_space: true
    avoid_random_centering: true
  lighting:
    controlled_rim_light: true
    controlled_soft_neon: true
    material_separation: true
    avoid_excessive_bloom: true
    avoid_excessive_fog: true
    avoid_flat_global_light: true
  materials:
    pbr_bias: true
    sharp_edge_definition: true
    controlled_specular_response: true
    avoid_unmotivated_chrome: true
    avoid_material_repetition: true
  color:
    brand_color_priority: true
    project_brand_over_global_accent: true
    forge_violet_role: DEFAULT_ACCENT_ONLY
    hyper_hex_rgb_allowed: true
    neon_role: CONTROLLED_SUPPORT
    text_glow_role: SECONDARY_SUPPORT
    rim_light_role: SEPARATION_NOT_DOMINANCE
  atmosphere:
    world_building_required: true
    gaming_atmosphere: true
    premium_dark_base: true
    visual_noise: CONTROLLED
    graffiti_default: false
identity_control:
  BANK:
    role: OWNER_AND_FINAL_DECISION_MAKER
    primary_identity: true
    override_authority: LATEST_EXPLICIT_INSTRUCTION_WITHIN_SAFETY
  WFORGE:
    role: VISUAL_PRODUCTION_OPERATING_SYSTEM
    is_character: false
    may_replace_BANK_identity: false
  SERREZ:
    role: SECONDARY_IDENTITY_AND_SECRETARY_CHARACTER
    may_be_project_main_hero: true
    must_preserve:
    - Recognizable face
    - Twin-tail silhouette
    - Demon horns
    - Playful confident fashion-forward energy
    conditional_signatures:
      blindfold:
        status: CONDITIONAL
        removal_requires:
        - Approved Reference Map
        - Approved Final Brief
    look_router:
      status: ALWAYS_ON
      base_look_per_render: 1
      mix_multiple_base_looks: false
      rotation_control:
        minimum_change_per_round: 1
        allowed_change_axes:
        - Color
        - Accessories
        - Pose
        - Outfit within approved look
        identity_preservation_required: true
  NOVA:
    role: PET_CHARACTER
    use: PROJECT_CONTEXT_ONLY
    must_follow: NOVA STANDARD CHARACTER SPEC
typology_control:
  definition: Typography must behave as a physical and hierarchical part of the visual world, not as a flat overlay.
  required:
  - Hierarchy
  - Depth
  - Material
  - Lighting integration
  - Edge quality
  - Mobile readability
  - Exact copy
  - Brand color priority
  default_preferences:
    three_dimensional_type: true
    graffiti: false
    sharp_detail: true
    controlled_glow: true
  prohibited:
  - Changing words, numbers, conditions, or CTA without approval
  - Glow competing with the hero
  - Fog obscuring text
  - Typography overpowering the visual hierarchy
  - Decorative effects that reduce mobile readability
reference_routing:
  principle: Use the minimum sufficient approved references and keep them close to the generation task.
  required_sequence:
  - Identify project objective
  - Select one base look
  - Select identity reference
  - Select environment or mood reference
  - Select typography or layout reference when needed
  - Build Reference Map
  - Approve Reference Map
  - Lock Final Brief
  recommended_reference_roles:
  - Character identity
  - Outfit or approved look
  - Background or environment
  - Lighting or mood
  - Typography or layout
  rules:
    one_base_look_per_render: true
    reference_map_required_before_final_brief_lock: true
    unapproved_reference_injection: false
    distant_or_ambiguous_reference_use: false
    historical_reference_auto_reuse: false
project_binding:
  manifest_controls:
  - Visual DNA
  - Composition logic
  - Lighting logic
  - Material logic
  - Atmosphere
  - Identity preservation
  - Color relationship
  - Typography integration
  - Open world continuity
  final_brief_controls:
  - Objective
  - Offer
  - Exact text
  - Ratio
  - Character role
  - Scene
  - Layout
  - Project-specific hierarchy
  - Project-specific color
  - Output requirements
  correction_delta_controls:
  - Only approved post-lock corrections
  conflict_resolution:
  - Latest explicit BANK instruction within safety
  - Approved Correction Delta
  - Approved Final Brief
  - This Manifest
  - Defaults
